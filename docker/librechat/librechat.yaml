# Стенд M0/M1: icarus смотрит на тот же эхо-сервер и на самого себя.
# Рабочий вариант — endpoint Icarus, эхо оставлен для отладки стыка.
version: 1.3.13
cache: true
endpoints:
  # Скиллы LibreChat — способность Agents. Стенду он нужен, чтобы скилл можно было
  # написать в UI, а icarus — забрать его через Management API (см. skills.sync в
  # config.yaml). Management API принимает только OIDC machine-токены; на стенде
  # провайдера играет docker/librechat/oidc-stub, который compose поднимает в сети
  # LibreChat по адресу http://localhost:9100.
  #
  # userId/tenantId — это ObjectId пользователя стенда LibreChat, чей набор скиллов
  # синхронизируется. Их значения для локального стенда печатает
  # `./script/librechat-skills-bind`; в бою здесь пользователь вашего LibreChat.
  agents:
    managementApi:
      auth:
        oidc:
          enabled: true
          issuer: 'http://localhost:9100'
          audience: 'icarus-skills'
        clients:
          - clientId: 'icarus-sync'
            subject: 'icarus-sync'
            userId: '000000000000000000000000'
            tenantId: 'default'

  custom:
    - name: 'Icarus'
      apiKey: 'icarus-local-token'
      baseURL: 'http://host.docker.internal:8081/v1'
      models:
        default: ['icarus']
        fetch: false
      # Заголовок разговора. LibreChat спросит его отдельным запросом; icarus
      # узнаёт этот запрос по titleModel и по метке в titlePrompt, отвечает сам
      # и в сессию pi его не пускает (см. packages/service/src/http/title.ts).
      # Текст промпта роли не играет: он только несёт метку и разговор — саму
      # просьбу к дешёвой модели icarus формулирует сам.
      titleConvo: true
      titleMethod: 'completion'
      titleModel: 'icarus-title'
      titleTiming: 'immediate'
      titlePrompt: |
        [[ICARUS_TITLE]]
        {convo}
      modelDisplayLabel: 'Икар'
      headers:
        x-icarus-user-id: '{{LIBRECHAT_USER_USERNAME}}'
        x-icarus-user-email: '{{LIBRECHAT_USER_EMAIL}}'
        x-icarus-conversation-id: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
        x-icarus-message-id: '{{LIBRECHAT_BODY_MESSAGEID}}'

    - name: 'EchoProbe'
      apiKey: 'probe'
      baseURL: 'http://host.docker.internal:4099/v1'
      models:
        default: ['echo-probe']
        fetch: false
      titleConvo: false
      modelDisplayLabel: 'Echo Probe'
      headers:
        X-Probe-User-Id: '{{LIBRECHAT_USER_ID}}'
        X-Probe-Conversation-Id: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
