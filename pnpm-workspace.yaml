# pnpm settings for the repository.
#
# Installation runs from the root: packages/* declare no dependencies of their own,
# everything needed (pi, typebox, development tools) lies in the root package.json.
#
# By default pnpm does not run dependency install scripts. Below are the ones we
# deliberately allow: esbuild places its binary, the other two are
# transitive dependencies of pi.
allowBuilds:
  esbuild: true
  protobufjs: true
  '@google/genai': true
