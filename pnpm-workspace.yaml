# Настройки pnpm для репозитория.
#
# Установка идёт из корня: пакеты packages/* своих зависимостей не объявляют,
# всё нужное (pi, typebox, инструменты разработки) лежит в корневом package.json.
#
# pnpm по умолчанию не запускает install-скрипты зависимостей. Ниже — те, кому мы
# это разрешаем осознанно: esbuild кладёт на место свой бинарник, остальные два —
# транзитивные зависимости pi.
allowBuilds:
  esbuild: true
  protobufjs: true
  '@google/genai': true
