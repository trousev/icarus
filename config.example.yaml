# Конфигурация Icarus.
#
# Рабочий файл — config.yaml рядом с этим; он в git не попадает, а ./script/update
# копирует его отсюда при первом запуске.
#
# Здесь всё общее для всех людей: модели, MCP. Ключи — в .env рядом (образец
# .env.example), у человека — только id (см. users внизу), из него выводятся имя
# контейнера, каталоги в dataDir и id сессии pi.

host: 0.0.0.0
# 8081 — тот же порт, что и на проде (там 8080 занят jitsi-jvb): одинаковый порт
# избавляет от «локально одно, в бою другое».
port: 8081

# Токен, под которым OpenAI-совместимый эндпоинт (/v1) пускает клиента. Сейчас
# основной вход — Telegram, а эндпоинт оставлен для будущих клиентов и отладки.
apiKey: icarus-local-token
# Внешний адрес панели управления: его Икар называет человеку в чате, и по нему же
# человек открывает панель из закладки. Не задан — берётся http://localhost:<port>.
# url: https://chat.trousev.pro/

# Где живут память, сессии и каталоги людей
dataDir: ~/icarus-data
# Язык ответов по умолчанию: ru или en. Человек может перекрыть его себе в панели
# («Пользователь» → язык): тогда выбор лежит в его profile.json рядом с памятью.
# Здесь — умолчание для тех, кто ещё не выбирал.
userLanguage: ru

# Через сколько минут тишины разговор считается законченным: Икар подводит итог
# (внутри pi это /compact — модель пересказывает разговор, пересказ остаётся в
# файле сессии) и гасит сессию pi. Пока человек говорит, сжатия нет: занятые
# сессии уборка пропускает, а переполненное окно pi сжимает сам. Следующая реплика
# поднимает pi заново, уже по сжатой истории; контейнер при этом остаётся поднятым.
sessionIdleMinutes: 60

# Панель управления. Пароля у неё нет: человека называет SSO-прокси, за которым она
# стоит, — nginx с Authelia подставляет заголовок Remote-User из ответа /api/verify
# и перетирает всё, что клиент прислал сам. Отсюда правило эксплуатации: порт icarus
# не должен смотреть наружу мимо прокси — кто дотянется до него напрямую, тот назовётся
# любым именем. Заголовок другого прокси (Traefik, Caddy, oauth2-proxy) задаётся здесь.
panel:
  userHeader: Remote-User
  # Локальный запуск без SSO: панель открывается от имени этого человека, и только
  # когда заголовка нет вовсе. На проде так делать нельзя — сервис об этом ругается.
  # devUser: probe

docker:
  image: icarus-user:dev
  prefix: icarus-user
  # network: icarus-net
  # socket: unix:///var/run/docker.sock
  # DNS-серверы контейнеров. Обычно не нужны: Docker отдаёт контейнерам резолвер хоста.
  # Пригодятся там, где резолвер хоста не пускает docker-подсети: unbound с access-control
  # только на 10.0.0.0/8 отвечает контейнерам REFUSED, и тогда Docker ждёт таймаут ~4 с,
  # прежде чем уйти на следующий сервер из resolv.conf — каждый запрос pi к модели
  # становится на эти секунды длиннее. Правильнее починить резолвер хоста, но если
  # нельзя — вот явный список:
  # dns: [1.1.1.1, 8.8.8.8]

# Модели: tier раздаёт эскалация — fast для болтовни и поиска, strong для работы руками,
# vision для картинок. thinking — уровень размышлений, он уезжает модели как есть
# (эскалация не даёт pi поднять его до ближайшего доступного). У DeepSeek-V4.1-Flash
# размышления задаются уровнем reasoning_effort, off выключает их совсем.
#
# Провайдера deepinfra pi сам не знает: его описание (базовый адрес, протокол, ключ)
# живёт в packages/service/src/providers.ts и уезжает в models.json контейнера. Здесь
# важны только имя провайдера и id модели. V4.1-Flash мультимодальная, поэтому одна и
# та же модель годится и для работы руками, и для картинок.
models:
  - provider: deepinfra
    id: deepseek-ai/DeepSeek-V4.1-Flash
    thinking: off
    tier: fast
  - provider: deepinfra
    id: deepseek-ai/DeepSeek-V4.1-Flash
    thinking: medium
    tier: strong
  - provider: deepinfra
    id: deepseek-ai/DeepSeek-V4.1-Flash
    thinking: off
    tier: vision

# Ключи провайдеров лежат в .env в корне (образец .env.example): провайдер из models,
# для которого там нашёлся ключ, сам уезжает в auth.json внутри контейнера. Здесь — только
# переопределение: свой ключ вместо .env или провайдер, которого нет в списке известных
# (PROVIDER_ENV в packages/service/src/config.ts).
# auth:
#   deepinfra: env:DEEPINFRA_API_KEY

# Окружение контейнера — им настраиваются наши расширения
env:
  ICARUS_EXTRACT_AFTER_MS: '20000'
  ICARUS_EXTRACT_MODEL: deepinfra/deepseek-ai/DeepSeek-V4.1-Flash
  # Часовой пояс человека. По нему Икар считает дату, часть суток и датирует память:
  # без него контейнер живёт в UTC, и вечерние записи уезжают во вчера. Обычно это
  # тот же пояс, что у тебя на хосте (у Дублина — Europe/Dublin).
  TZ: Europe/Dublin
  # Субагенты: одновременных детей (потолок 8), задач за вызов и пределы времени.
  # По умолчанию 4 параллельно — столько же, сколько запускает ведущий агент у Anthropic;
  # больше восьми не даём: это уже провайдер и CPU контейнера, а не вкус.
  ICARUS_SUBAGENT_CONCURRENCY: '4'
  ICARUS_SUBAGENT_MAX_TASKS: '40'
  ICARUS_SUBAGENT_TASK_TIMEOUT_MS: '300000'
  ICARUS_SUBAGENT_BUDGET_MS: '900000'

# Кастомных маунтов с хоста больше нет: контейнер видит только рабочие папки
# (`/workspaces/<имя>`), служебный `.icarus` и установку Maple. Нужен чужой
# репозиторий — сделай `git clone` в один из workspace'ов.

# MCP-серверы: то, чем Икар обрастает без правки кода.
#
# Здесь — ОБЩИЕ серверы стека: их видят все люди, и заводит их тот, кто ведёт
# config.yaml. Личные и расшаренные серверы добавляются в панели, раздел «MCP»:
# они лежат в dataDir/mcp и переключаются каждому человеку отдельно. Общий сервер
# из этого блока человек тоже может выключить себе — конфиг от этого не меняется.
#
# lifecycle: lazy (дефолт) — сервер не подключается заранее, и его инструменты не
# висят в промпте каждого разговора. В AGENTS.md для такого сервера появляется
# подсказка: перед первым использованием модель зовёт mcp_connect. description —
# человеческое объяснение, когда сервер нужен; без него модель видит только имя.
# lifecycle: eager — сервер нужен всегда, его инструменты едут в каждый запрос.
# hidden: true — служебный сервер: он есть у всех, в панели его нет, выключить себе
# его нельзя. Так живут встроенные умения (Maple), а не чужие инструменты.
mcp:
  echo:
    command: node
    args: ['/opt/icarus/mcp/echo-server.mjs']
    lifecycle: eager
# Maple: обычный встроенный MCP. Установка и код сервера монтируются из репозитория,
# MAPLE_DIR задаётся в .env — сервис монтирует его в контейнер тем же путём, что и
# на хосте: launcher ищет свои библиотеки по записанному внутри пути.
#
# Своего хранилища у сервера нет: журналы сессий и графики он держит в рабочей папке
# разговора, в скрытом `.maple/`. Своего раздела в панели тоже нет — hidden: true
# убирает его из списка MCP и запрещает выключать: это встроенное умение.
#  maple:
#    command: node
#    args: ['/opt/icarus/tools/maple-mcp/server.mjs']
#    env:
#      MAPLE_BIN: ${MAPLE_DIR}/bin/maple
#      MAPLE_TIMEOUT_SECONDS: "25"
#    lifecycle: eager
#    hidden: true
#    description: "Математика и аналитика: символьно, численно и графиками"

# Home Assistant: MCP-сервер живёт в самом HA (адрес вида <хост>/api/mcp) и без
# ключа отвечает 401 — авторизация у него не своя, а обычная для HA: долгоживущий
# ключ доступа. Выписать его: <адрес HA>/profile/security → «Long-lived access
# tokens» → «Create token»; ключ показывается один раз и живёт 10 лет. Выписать
# может любой пользователь, но эндпоинт пустит только администратора, если у
# интеграции Model Context Protocol Server включена опция «Require an administrator
# account» (у новых записей — включена; не админу он ответит 403, а не 401).
# Сам ключ — в .env, в конфиге только подстановка: он в git, а ключ нет.
# Инструменты приедут Икару с префиксом: mcp_homeassistant_<имя>.
# lifecycle: lazy — сервер подключится только когда разговор коснётся дома; до
# этого его инструменты не занимают промпт и не мешают остальным сессиям.
#  homeassistant:
#    transport: streamable-http
#    url: http://10.0.0.16/api/mcp
#    headers:
#      Authorization: Bearer ${HOMEASSISTANT_TOKEN}
#    lifecycle: lazy
#    description: "Умный дом: свет, климат, сцены, датчики и состояния устройств"

# Люди: id и, если надо, флаг админа. От id зависят имя контейнера, каталоги в
# dataDir и id сессии pi. В Telegram человек сопоставляется с id через
# telegram.mapping ниже; HTTP-клиент присылает тот же id заголовком x-icarus-user-id.
# Id существующего человека менять нельзя без переноса его каталога в dataDir/users.
#
# admin: true открывает раздел «Ключи» — право править секреты всей инсталляции.
# Флаг можно опустить: у конфига, написанного до его появления, админом считается
# один trousev (так прошла миграция), остальные — обычные люди. Явное
# `admin: false` забирает флаг даже у него.

users:
  - id: probe
    admin: true
  - id: probe2

# Скиллы pi живут в ~/.pi/agent/skills человека (каталог монтируется сервисом).
# Пишутся они в панели, раздел «Скиллы»: каталог — git-репозиторий, и сохранённый
# скилл доезжает до Икара следующим ходом.

# Telegram — основной вход к Икару: бот отвечает в личке и в группах, память
# и контейнер у человека те же, что у HTTP-клиента, а разговоры свои (свой разговор
# на чат, поэтому болтовня в Telegram не путается с чатом через /v1). Понимает текст,
# фото и голосовые: картинка уезжает модели нативно и ложится в incoming/ человека,
# голосовое сначала расшифровывается (см. speech ниже), а видео и стикеры бот честно
# просит прислать словами.
#
# mapping — кто есть кто: telegram username → id человека из users. На проде это
# логины, под которыми люди ходили в чат раньше: от id зависят их каталоги памяти.
# Username пишется без «@», и в yaml его придётся взять в кавычки:
# с @ начинаются зарезервированные конструкции, и `@trousev: trousev` не разберётся.
# Тот же маппинг принимается отдельным ключом telegram_mapping — ровно как он
# читается глазами:
#
#   telegram_mapping:
#     '@trousev': trousev
#
# Токен бота в конфиге не нужен: он подхватывается из .env (TELEGRAM_BOT_TOKEN,
# образец .env.example). Нет токена или пусто в mapping — бот не поднимается, а
# сервис работает как раньше. Команды бота: /compact, /stop, /stats, /clear,
# /skills и /help — что каждая делает, написано в README, раздел «Telegram».
#
# Топики (мультичат: свой разговор на топик) включаются не здесь и не в чате, а в
# Mini App @BotFather: My bots → бот → Bot Settings → Threads Settings → Threaded
# Mode. В текстовом меню /mybots этого пункта нет; прямая ссылка на Mini App —
# https://t.me/BotFather?startapp. Режим выключен — /topic не зовёт Telegram, а
# объясняет, где галочка, а разговор остаётся один на чат. Команды топиков:
# /topic [имя] — завести разговор, /topics — какие бот помнит, /rename — переименовать.
#
# telegram:
#   mapping:
#     '@trousev': probe
#     '@vita': probe2

# Голосовые из Telegram: модель звука не слышит, поэтому голосовое сначала
# расшифровывается отдельным запросом к провайдеру — метод /audio/transcriptions
# (у DeepInfra это Whisper). Ключ берётся из auth по имени провайдера, то есть тот
# же, что у моделей: по умолчанию достаточно DEEPINFRA_API_KEY в .env. Звук уезжает
# провайдеру, а не модели; нет ключа — бот отвечает, что голосовых не разбирает.
#
# language — подсказка распознавателю, необязательна: на русской диктовке помогает.
# Выключить распознавание совсем — `speech: none`.
#
# speech:
#   provider: deepinfra
#   model: openai/whisper-large-v3
#   language: ru
