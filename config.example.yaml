# Конфигурация Icarus.
#
# Рабочий файл — config.yaml рядом с этим; он в git не попадает, а ./script/update
# копирует его отсюда при первом запуске.
#
# Здесь всё общее для всех людей: модели, MCP, маунты. Ключи — в .env рядом (образец
# .env.example), у человека — только id (см. users внизу), из него выводятся имя
# контейнера, каталоги в dataDir и id сессии pi.

host: 0.0.0.0
# 8081 — тот же порт, что и на проде (там 8080 занят jitsi-jvb): одинаковый порт
# избавляет от «локально одно, в бою другое».
port: 8081

# Токен, под которым LibreChat ходит в icarus (endpoint Icarus в librechat.yaml)
apiKey: icarus-local-token
# Внешний адрес панели управления: его Икар называет человеку в чате, и по нему же
# человек открывает панель из закладки. Не задан — берётся http://localhost:<port>.
# url: https://memory.trousev.pro/

# Где живут память, сессии и каталоги людей
dataDir: ~/icarus-data
# Через сколько минут тишины разговор считается законченным: Икар подводит итог
# (внутри pi это /compact — модель пересказывает разговор, пересказ остаётся в
# файле сессии) и гасит сессию pi. Пока человек говорит, сжатия нет: занятые
# сессии уборка пропускает, а переполненное окно pi сжимает сам. Следующая реплика
# поднимает pi заново, уже по сжатой истории; контейнер при этом остаётся поднятым.
sessionIdleMinutes: 60

# Панель управления. Пароля у неё нет: человека называет SSO-прокси, за которым она
# стоит, — nginx с Authelia подставляет заголовок Remote-User из ответа /api/verify
# и перетирает всё, что клиент прислал сам. Отсюда правило эксплуатации: порт icarus
# не должен смотреть наружу мимо прокси — кто дотянется до него напрямую, тот назовётся
# любым именем. Заголовок другого прокси (Traefik, Caddy, oauth2-proxy) задаётся здесь.
panel:
  userHeader: Remote-User
  # Локальный запуск без SSO: панель открывается от имени этого человека, и только
  # когда заголовка нет вовсе. На проде так делать нельзя — сервис об этом ругается.
  # devUser: probe

docker:
  image: icarus-user:dev
  prefix: icarus-user
  # network: icarus-net
  # socket: unix:///var/run/docker.sock
  # DNS-серверы контейнеров. Обычно не нужны: Docker отдаёт контейнерам резолвер хоста.
  # Пригодятся там, где резолвер хоста не пускает docker-подсети: unbound с access-control
  # только на 10.0.0.0/8 отвечает контейнерам REFUSED, и тогда Docker ждёт таймаут ~4 с,
  # прежде чем уйти на следующий сервер из resolv.conf — каждый запрос pi к модели
  # становится на эти секунды длиннее. Правильнее починить резолвер хоста, но если
  # нельзя — вот явный список:
  # dns: [1.1.1.1, 8.8.8.8]

# Модели: tier раздаёт эскалация — fast для болтовни и поиска, strong для работы руками,
# vision для картинок. thinking — уровень размышлений, он уезжает модели как есть
# (эскалация не даёт pi поднять его до ближайшего доступного). У DeepSeek-V4.1-Flash
# размышления задаются уровнем reasoning_effort, off выключает их совсем.
#
# Провайдера deepinfra pi сам не знает: его описание (базовый адрес, протокол, ключ)
# живёт в packages/service/src/providers.ts и уезжает в models.json контейнера. Здесь
# важны только имя провайдера и id модели. V4.1-Flash мультимодальная, поэтому одна и
# та же модель годится и для работы руками, и для картинок.
models:
  - provider: deepinfra
    id: deepseek-ai/DeepSeek-V4.1-Flash
    thinking: off
    tier: fast
  - provider: deepinfra
    id: deepseek-ai/DeepSeek-V4.1-Flash
    thinking: medium
    tier: strong
  - provider: deepinfra
    id: deepseek-ai/DeepSeek-V4.1-Flash
    thinking: off
    tier: vision

# Ключи провайдеров лежат в .env в корне (образец .env.example): провайдер из models,
# для которого там нашёлся ключ, сам уезжает в auth.json внутри контейнера. Здесь — только
# переопределение: свой ключ вместо .env или провайдер, которого нет в списке известных
# (PROVIDER_ENV в packages/service/src/config.ts).
# auth:
#   deepinfra: env:DEEPINFRA_API_KEY

# Окружение контейнера — им настраиваются наши расширения
env:
  ICARUS_EXTRACT_AFTER_MS: '20000'
  ICARUS_EXTRACT_MODEL: deepinfra/deepseek-ai/DeepSeek-V4.1-Flash
  # Часовой пояс человека. По нему Икар считает дату, часть суток и датирует память:
  # без него контейнер живёт в UTC, и вечерние записи уезжают во вчера. Обычно это
  # тот же пояс, что у тебя на хосте (у Дублина — Europe/Dublin).
  TZ: Europe/Dublin

# Каталоги с хоста: пока общие для всех, у каждого человека те же (плюс его личные)
mounts: []
# mounts:
#   - host: ~/src/scratchpad
#     container: /workspace/scratchpad
#     mode: ro

# MCP-серверы: то, чем Икар обрастает без правки кода
mcp:
  echo:
    command: node
    args: ['/opt/icarus/mcp/echo-server.mjs']
    lifecycle: eager
# Maple: считается локально, файлы сервера монтируются из репозитория.
# MAPLE_DIR задаётся в .env; обе стороны маунта обязаны совпадать — launcher
# Maple ищет свои библиотеки по тому же пути, что записан внутри него.
#
# Куда Maple пишет журналы сессий и графики, задаётся здесь и обязано указывать в
# /workspace/maple: это персистентный маунт из dataDir, который сервис монтирует
# сам (прописывать его в mounts не нужно). MCP-мост pi живёт только на время чата,
# а контейнер человека пересоздаётся на каждом ./script/server — всё, что осталось
# в других местах контейнера, расчёт не переживёт. Раздел «математика» в панели
# управления читает ровно этот каталог.
#  maple:
#    command: node
#    args: ['/opt/icarus/tools/maple-mcp/server.mjs']
#    env:
#      MAPLE_BIN: ${MAPLE_DIR}/bin/maple
#      MAPLE_TIMEOUT_SECONDS: "25"
#      MAPLE_SESSION_DIR: /workspace/maple
#      MAPLE_PLOT_DIR: /workspace/maple
#      MAPLE_PLOT_URL_BASE: http://localhost:8081/maple
#    lifecycle: eager
# и в mounts выше:
#   - host: ${MAPLE_DIR}
#     container: ${MAPLE_DIR}
#     mode: ro
#   - host: <путь к чекауту>/tools
#     container: /opt/icarus/tools
#     mode: ro

# Люди: только id. Тот же id должен быть у человека в LibreChat — он приезжает
# заголовком x-icarus-user-id. В стенде это {{LIBRECHAT_USER_USERNAME}} (там пароли,
# ldapId не заполнен), на проде — {{LIBRECHAT_USER_LDAPID}}, то есть uid из LDAP;
# именно uid, а не username: username LibreChat собирает из givenName.

users:
  - probe
  - probe2

# Скиллы pi живут в ~/.pi/agent/skills человека (каталог монтируется сервисом).
# Синхронизации с LibreChat нет: скиллы кладут файлами, панель правки — отдельная задача.

# Telegram — второй вход к тому же Икару: бот отвечает в личке и в группах, память
# и контейнер у человека те же, что в LibreChat, а разговоры свои (свой разговор на
# чат, поэтому болтовня в Telegram не путается с чатом LibreChat). Понимает текст,
# фото и голосовые: картинка уезжает модели нативно и ложится в incoming/ человека,
# голосовое сначала расшифровывается (см. speech ниже), а видео и стикеры бот честно
# просит прислать словами.
#
# mapping — кто есть кто: telegram username → id человека из users (на проде это uid
# из LDAP, на стенде username — то же значение, что приезжает в x-icarus-user-id).
# Username пишется без «@», и в yaml его придётся взять в кавычки:
# с @ начинаются зарезервированные конструкции, и `@trousev: trousev` не разберётся.
# Тот же маппинг принимается отдельным ключом telegram_mapping — ровно как он
# читается глазами:
#
#   telegram_mapping:
#     '@trousev': trousev
#
# Токен бота в конфиге не нужен: он подхватывается из .env (TELEGRAM_BOT_TOKEN,
# образец .env.example). Нет токена или пусто в mapping — бот не поднимается, а
# сервис работает как раньше. Команда у бота одна: /compact — подвести итог сейчас.
#
# telegram:
#   mapping:
#     '@trousev': probe
#     '@vita': probe2

# Голосовые из Telegram: модель звука не слышит, поэтому голосовое сначала
# расшифровывается отдельным запросом к провайдеру — метод /audio/transcriptions
# (у DeepInfra это Whisper). Ключ берётся из auth по имени провайдера, то есть тот
# же, что у моделей: по умолчанию достаточно DEEPINFRA_API_KEY в .env. Звук уезжает
# провайдеру, а не модели; нет ключа — бот отвечает, что голосовых не разбирает.
#
# language — подсказка распознавателю, необязательна: на русской диктовке помогает.
# Выключить распознавание совсем — `speech: none`.
#
# speech:
#   provider: deepinfra
#   model: openai/whisper-large-v3
#   language: ru
