# Icarus configuration.
#
# The working file is config.yaml next to this one; it does not go into git, and ./script/update
# copies it from here on first start.
#
# Everything here is common to all people: models, MCP. Keys — in .env next to it (sample
# .env.example), a person has only an id (see users below), from which the container name,
# directories in dataDir and the pi session id are derived.

host: 0.0.0.0
# 8081 — the same port as in prod (there 8080 is taken by jitsi-jvb): the same port
# saves you from "one thing locally, another in production".
port: 8081

# Token under which the OpenAI-compatible endpoint (/v1) lets a client in. Currently
# the main entry is Telegram, and the endpoint is kept for future clients and debugging.
apiKey: icarus-local-token
# External address of the control panel: Icarus gives it to a person in chat, and by it
# the person opens the panel from a bookmark. If unset — http://localhost:<port> is taken.
# url: https://chat.trousev.pro/

# Where memory, sessions and user directories live
dataDir: ~/icarus-data
# Default answer language: ru or en. A person can override it for themselves in the panel
# ("User" → language): then the choice lives in their profile.json next to the memory.
# Here — the default for those who have not chosen yet.
userLanguage: ru

# After how many minutes of silence a conversation is considered finished: Icarus sums it up
# (inside pi this is /compact — the model retells the conversation, the retelling stays in the
# session file) and shuts down the pi session. While a person talks, there is no compaction: busy
# sessions are skipped by the cleanup, and an overflowing pi window compacts itself. The next message
# raises pi again, already from the compacted history; the container stays up.
sessionIdleMinutes: 60

# Control panel. It has no password: the person is named by the SSO proxy behind which it
# stands — nginx with Authelia substitutes the Remote-User header from the /api/verify response
# and overwrites everything the client sent itself. Hence the operating rule: the icarus port
# must not look outward past the proxy — whoever reaches it directly will name themselves
# any name. The header of another proxy (Traefik, Caddy, oauth2-proxy) is set here.
panel:
  userHeader: Remote-User
  # Local run without SSO: the panel opens on behalf of this person, and only
  # when there is no header at all. This must not be done in prod — the service complains about it.
  # devUser: probe

docker:
  image: icarus-user:dev
  prefix: icarus-user
  # network: icarus-net
  # socket: unix:///var/run/docker.sock
  # DNS servers of the containers. Usually not needed: Docker gives the containers the host resolver.
  # They come in handy where the host resolver does not allow docker subnets: unbound with access-control
  # only on 10.0.0.0/8 answers containers with REFUSED, and then Docker waits ~4 s for the timeout
  # before going to the next server from resolv.conf — every pi request to the model
  # becomes that many seconds longer. The right thing is to fix the host resolver, but if
  # you cannot — here is an explicit list:
  # dns: [1.1.1.1, 8.8.8.8]

# Models: tier is distributed by escalation — fast for chatter and search, strong for work with hands,
# vision for images. thinking — the level of reasoning, it goes to the model as is
# (escalation does not let pi raise it to the nearest available one). For DeepSeek-V4.1-Flash
# reasoning is set by the reasoning_effort level, off disables it entirely.
# We keep fast and vision on low: without thinking the model loses a separate channel and starts
# writing tool calls as markup right in the answer. The cost — ~2 s to the first visible
# token; strong thinks anyway, low is pointless for it.
#
# pi itself does not know the deepinfra provider: its description (base address, protocol, key)
# lives in packages/service/src/providers.ts and goes into the container's models.json. Here
# only the provider name and the model id matter. V4.1-Flash is multimodal, so the same
# model works both for working with hands and for images.
models:
  - provider: deepinfra
    id: deepseek-ai/DeepSeek-V4.1-Flash
    thinking: low
    tier: fast
  - provider: deepinfra
    id: deepseek-ai/DeepSeek-V4.1-Flash
    thinking: medium
    tier: strong
  - provider: deepinfra
    id: deepseek-ai/DeepSeek-V4.1-Flash
    thinking: low
    tier: vision

# Provider keys live in .env in the root (sample .env.example): a provider from models
# for which a key was found there goes into auth.json inside the container by itself. Here — only
# an override: your own key instead of .env or a provider that is not in the list of known ones
# (PROVIDER_ENV in packages/service/src/config.ts).
# auth:
#   deepinfra: env:DEEPINFRA_API_KEY

# Container environment — our extensions are configured by it
env:
  ICARUS_EXTRACT_AFTER_MS: '20000'
  ICARUS_EXTRACT_MODEL: deepinfra/deepseek-ai/DeepSeek-V4.1-Flash
  # A person's time zone. Icarus counts the date, the part of the day and dates memory by it:
  # without it the container lives in UTC, and evening entries slip to yesterday. Usually it is
  # the same zone as on your host (for Dublin — Europe/Dublin).
  TZ: Europe/Dublin
  # Subagents: simultaneous children (ceiling 8), tasks per call and time limits.
  # By default 4 in parallel — the same number the lead agent runs at Anthropic;
  # we do not give more than eight: at that point it is the provider and the container CPU, not taste.
  ICARUS_SUBAGENT_CONCURRENCY: '4'
  ICARUS_SUBAGENT_MAX_TASKS: '40'
  ICARUS_SUBAGENT_TASK_TIMEOUT_MS: '300000'
  ICARUS_SUBAGENT_BUDGET_MS: '900000'

# There are no more custom mounts from the host: the container sees only working folders
# (`/workspaces/<name>`), the service `.icarus` and the Maple installation. Need someone else's
# repository — do `git clone` into one of the workspaces.

# MCP servers: what Icarus grows with without editing code.
#
# Here — COMMON stack servers: all people see them, and they are set up by whoever maintains
# config.yaml. Personal and shared servers are added in the panel, "MCP" section:
# they live in dataDir/mcp and are toggled per person. A person can also disable a common server
# from this block for themselves — the config does not change because of that.
#
# Секреты у каждого MCP свои. Общий сервер объявляет только ИМЕНА: secrets: [Authorization]
# (для stdio — имена переменных окружения). Значение вводит человек в панели
# (MCP → «Настроить доступ»), и оно ложится в его credentials.json под этим
# сервером. Поэтому подстановок ${VAR}/env: в mcp.headers и mcp.env нет: там
# остаются только несекретные настройки — адреса, порты, режимы.
#
# lifecycle: lazy (дефолт) — сервер не подключается заранее, и его инструменты не
# висят в промпте каждого разговора. В AGENTS.md для такого сервера появляется
# подсказка: перед первым использованием модель зовёт mcp_connect. description —
# человеческое объяснение, когда сервер нужен; без него модель видит только имя.
# lifecycle: eager — сервер нужен всегда, его инструменты едут в каждый запрос.
# hidden: true — служебный сервер: он есть у всех, в панели его нет, выключить себе
# его нельзя. Так живут встроенные умения (Maple), а не чужие инструменты.
mcp:
  echo:
    command: node
    args: ['/opt/icarus/mcp/echo-server.mjs']
    # We do not raise even the demo server at start: eager is only a deliberate choice.
    lifecycle: lazy
  # Artifacts: the shared /artifacts library for the whole family — pages, documents,
  # images. The server creates the folder and rights via artifact_new, explains the structure
  # (index.html | index.md | index.png + the required index.ai.md) and issues a link.
  # Folder rights (.folder-acl.json): me/family × none/read/write/admin, by default
  # me=admin, family=none — the artifact is personal, the family does not see it until explicitly opened;
  # the rights are checked by the panel, MCP and the generic folder-guard.
  # Version history: the folder has its own hidden git, commits after every write/edit;
  # in the panel — "History" and "Revert". Service files are not versioned.
  #
  # hidden: true removes the server from the MCP section and forbids disabling it — this is
  # a built-in ability. lifecycle: lazy keeps the instructions and tools out of the prompt
  # until a person talks about artifacts: then the model sees a short trigger
  # in AGENTS.md, connects the server and gets the full instructions. That way "hidden"
  # rules do not take up context in every conversation.
  artifacts:
    command: node
    args: ['/opt/icarus/tools/artifacts-mcp/server.mjs']
    lifecycle: lazy
    hidden: true
    description: "Артефакты: общая библиотека /artifacts — страницы, документы и картинки с правами для семьи"
# Maple: a regular built-in MCP. The installation and server code are mounted from the repository,
# MAPLE_DIR is set in .env — the service mounts it into the container at the same path as
# on the host: the launcher looks for its libraries by the recorded internal path.
#
# Своего хранилища у сервера нет: журналы сессий и графики он держит в рабочей папке
# разговора, в скрытом `.maple/`. Своего раздела в панели тоже нет — hidden: true
# убирает его из списка MCP и запрещает выключать: это встроенное умение.
# MAPLE_BIN — путь буквально, без ${MAPLE_DIR}: у MCP больше нет подстановок.
#  maple:
#    command: node
#    args: ['/opt/icarus/tools/maple-mcp/server.mjs']
#    env:
#      MAPLE_BIN: /opt/maple18/bin/maple
#      MAPLE_TIMEOUT_SECONDS: "25"
#    lifecycle: eager
#    hidden: true
#    description: "Mathematics and analytics: symbolic, numeric, and with plots"

# Home Assistant: MCP-сервер живёт в самом HA (адрес вида <хост>/api/mcp) и без
# ключа отвечает 401 — авторизация у него не своя, а обычная для HA: долгоживущий
# ключ доступа. Выписать его: <адрес HA>/profile/security → «Long-lived access
# tokens» → «Create token»; ключ показывается один раз и живёт 10 лет. Выписать
# может любой пользователь, но эндпоинт пустит только администратора, если у
# интеграции Model Context Protocol Server включена опция «Require an administrator
# account» (у новых записей — включена; не админу он ответит 403, а не 401).
#
# В конфиге — только имя секрета. Значение каждый вводит в панели сам, со своим
# ключом: сервер из config.yaml больше не берёт ключ из .env.
# Инструменты приедут Икару с префиксом: mcp_homeassistant_<имя>.
# lifecycle: lazy — сервер подключится только когда разговор коснётся дома; до
# этого его инструменты не занимают промпт и не мешают остальным сессиям.
#  homeassistant:
#    transport: streamable-http
#    url: http://10.0.0.16/api/mcp
#    secrets: [Authorization]
#    lifecycle: lazy
#    description: "Smart home: lights, climate, scenes, sensors, and device states"

# People: id and, if needed, the admin flag. The container name, directories in
# dataDir and the pi session id depend on the id. In Telegram a person is matched to an id via
# telegram.mapping below; an HTTP client sends the same id in the x-icarus-user-id header.
# The id of an existing person cannot be changed without moving their directory in dataDir/users.
#
# admin: true opens the "Keys" section — the right to edit the secrets of the whole installation.
# The flag can be omitted: for a config written before it appeared, only
# one trousev is considered admin (that is how the migration went), the rest are ordinary people. An explicit
# `admin: false` takes the flag away even from him.

users:
  - id: probe
    admin: true
  - id: probe2

# pi skills live in a person's ~/.pi/agent/skills (the directory is mounted by the service).
# They are written in the panel, "Skills" section: the directory is a git repository, and a saved
# skill reaches Icarus on the next turn.

# Telegram — the main entry to Icarus: the bot answers in DMs and in groups, the memory
# and container of a person are the same as those of an HTTP client, but the conversations are their own (one conversation
# per chat, so chatter in Telegram does not get mixed up with chat via /v1). It understands text,
# photos and voice: an image goes to the model natively and lands in the person's incoming/,
# a voice message is first transcribed (see speech below), and the bot honestly asks for video and stickers
# to be sent in words.
#
# mapping — who is who: telegram username → person id from users. In prod these are
# the logins under which people used to go to chat: their memory directories depend on the id.
# The username is written without "@", and in yaml you will have to quote it:
# reserved constructs start with @, and `@trousev: trousev` will not be parsed.
# The same mapping is accepted by a separate key telegram_mapping — exactly as it
# reads by eye:
#
#   telegram_mapping:
#     '@trousev': trousev
#
# The bot token is not needed in the config: it is picked up from .env (TELEGRAM_BOT_TOKEN,
# sample .env.example). No token or empty mapping — the bot does not come up, and
# the service works as before. Bot commands: /compact, /stop, /stats, /clear,
# /skills and /help — what each does is written in the README, "Telegram" section.
#
# Topics (multi-chat: its own conversation per topic) are enabled not here and not in chat, but in
# the @BotFather Mini App: My bots → bot → Bot Settings → Threads Settings → Threaded
# Mode. There is no such item in the /mybots text menu; a direct link to the Mini App —
# https://t.me/BotFather?startapp. Mode off — /topic does not call Telegram, it
# explains where the checkbox is, and the conversation stays one per chat. Topic commands:
# /topic [name] — start a conversation, /topics — which ones the bot remembers, /rename — rename.
#
# telegram:
#   mapping:
#     '@trousev': probe
#     '@vita': probe2

# Voice messages from Telegram: the model does not hear sound, so a voice message is first
# transcribed by a separate request to the provider — the /audio/transcriptions method
# (at DeepInfra this is Whisper). The key is taken from auth by provider name, that is the same
# as for models: by default DEEPINFRA_API_KEY in .env is enough. The sound goes
# to the provider, not to the model; no key — the bot answers that it does not handle voice messages.
#
# language — a hint to the recognizer, optional: it helps with Russian dictation.
# Disable recognition entirely — `speech: none`.
#
# speech:
#   provider: deepinfra
#   model: openai/whisper-large-v3
#   language: ru
